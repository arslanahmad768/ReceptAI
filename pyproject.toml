[project]
name = "receptai"
version = "1.0.0"
description = "Lead engine: scrape → qualify → find emails → generate cold emails → send via Resend"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ─────────────────────────────────────────────────────────
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",      # required for OAuth2PasswordRequestForm

    # ── Config & validation ───────────────────────────────────────────────────
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",

    # ── Auth ──────────────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",

    # ── Database ──────────────────────────────────────────────────────────────
    "supabase>=2.4",
    "httpx>=0.27",

    # ── Rate limiting ─────────────────────────────────────────────────────────
    "slowapi>=0.1.9",
    "sse-starlette>=2.0",

    # ── Email delivery ────────────────────────────────────────────────────────
    "resend>=2.0",

    # ── Cron scheduling ───────────────────────────────────────────────────────
    "apscheduler>=3.10",

    # ── Scraper: Stage 1 (Google Maps) ───────────────────────────────────────
    "camoufox[geoip]>=0.4",
    "playwright>=1.44",

    # ── Scraper: Stage 2 (LLM qualification via Groq OpenAI-compatible API) ──
    "openai>=1.0",

    # ── Scraper: Stage 3 (email discovery) ───────────────────────────────────
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",               # MX record lookups for SMTP verification
    "langchain-openai>=0.1",        # ChatOpenAI for browser-use agent
    "browser-use>=0.12",            # AI browser agent (last-resort fallback)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]
